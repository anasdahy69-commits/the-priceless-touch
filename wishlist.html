<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - The Priceless Touch</title>
    
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="images/favicon.ico">

    <style>
        /* Colors and Variables: Default is Royal Burgundy (Dark Mode) */
        :root {
            --bg-color: #3b0a12;
            --text-color: #ffffff;
            --nav-bg: #3b0a12;
            --border-color: rgba(255, 255, 255, 0.2);
            --accent-gold: #f3d06b;
            --header-action-color: #ffffff;
            --btn-hover-bg: rgba(255, 255, 255, 0.12);
            --footer-color: rgba(255, 255, 255, 0.6);
            --pure-icon-color: #ffffff; 
            --nav-link-color: #ffffff;
        }

        body.light-mode {
            --bg-color: #fcfbfa;
            --text-color: #2c2c2c;
            --nav-bg: #f5f2f0;
            --border-color: rgba(0, 0, 0, 0.15);
            --accent-gold: #997413;
            --header-action-color: #000000;
            --btn-hover-bg: rgba(0, 0, 0, 0.08);
            --footer-color: #2d6a4f;
            --pure-icon-color: #000000; 
            --nav-link-color: #2d6a4f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--nav-bg);
            padding: 16px 18px;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 650px;
            margin: 0 auto;
            width: 100%;
        }

        #theme-toggle {
            background: transparent;
            border: none;
            color: var(--pure-icon-color);
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            transition: opacity 0.3s ease;
        }

        #theme-toggle svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        .nav-link {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            color: var(--nav-link-color);
            text-decoration: none;
            text-transform: uppercase;
            white-space: nowrap;
            transition: opacity 0.3s ease;
        }

        .nav-link:hover {
            opacity: 0.8;
        }

        .content-container {
            padding: 50px 24px 30px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 25px;
            max-width: 650px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        .main-title {
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 1.8px;
            line-height: 1.4;
            font-family: serif;
            text-transform: uppercase;
            margin: 0;
        }

        .empty-message {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 20px;
        }

        .wishlist-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            margin-top: 15px;
        }

        .wishlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            background: var(--btn-hover-bg);
            text-align: left;
        }

        .wishlist-item-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-color);
            text-decoration: none;
        }

        .wishlist-item-title:hover {
            color: var(--accent-gold);
        }

        .remove-btn {
            background: transparent;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 14px;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .remove-btn:hover {
            opacity: 1;
            color: #ff4d4d;
        }

        .btn {
            display: inline-block;
            width: auto;
            min-width: 200px;
            padding: 12px 28px;
            border: 1.5px solid var(--text-color);
            border-radius: 35px;
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.5px;
            background: transparent;
            margin-top: 25px;
            cursor: pointer;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .btn:hover {
            background: var(--btn-hover-bg);
            border-color: var(--accent-gold);
        }

        footer {
            margin-top: auto;
            padding: 24px 20px 35px 20px;
            font-size: 11px;
            font-weight: 500;
            line-height: 1.6;
            color: var(--footer-color);
            border-top: 1px solid var(--border-color);
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
            width: 100%;
            transition: color 0.3s ease, border-color 0.3s ease;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <button id="theme-toggle" aria-label="Toggle Theme">
                <span id="theme-icon"></span>
            </button>
            <a href="index.html" class="nav-link">Home</a>
        </div>
    </header>

    <div class="content-container">
        <h1 class="main-title">Your Wishlist</h1>
        <div id="wishlist-container" class="wishlist-grid">
            <!-- المنتجات المحفوظة هتظهر هنا أوتوماتيك -->
        </div>
        <button onclick="goBack()" class="btn">BACK</button>
    </div>

    <footer>
        <p>Affiliate Disclosure: We are a participant in affiliate programs with Amazon, Target, Walmart, and other major retailers. We may earn a commission from qualifying purchases at no extra cost to you, helping us bring you the finest selections.</p>
    </footer>

    <script>
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIconSpan = document.getElementById('theme-icon');
        const bodyElement = document.body;

        const sunSvg = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.93 4.93l1.77 1.77M17.3 17.3l1.77 1.77M4.93 19.07l1.77-1.77M17.3 6.7l1.77-1.77" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
        const moonSvg = `<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/></svg>`;

        function updateThemeUI(isLight) {
            if (isLight) {
                bodyElement.classList.add('light-mode');
                themeIconSpan.innerHTML = moonSvg;
                localStorage.setItem('theme', 'light');
            } else {
                bodyElement.classList.remove('light-mode');
                themeIconSpan.innerHTML = sunSvg;
                localStorage.setItem('theme', 'dark');
            }
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            updateThemeUI(true);
        } else {
            updateThemeUI(false);
        }

        themeToggleBtn.addEventListener('click', () => {
            const isLightNow = bodyElement.classList.contains('light-mode');
            updateThemeUI(!isLightNow);
        });

        // Smart Back function to return to the exact previous page
        function goBack() {
            if (document.referrer && document.referrer !== window.location.href) {
                history.back();
            } else {
                window.location.href = 'index.html'; // Fallback to home if no history
            }
        }

        // كود عرض عناصر المفضلة المحفوظة على جهاز الزائر
        function loadWishlist() {
            const container = document.getElementById('wishlist-container');
            let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];

            if (wishlist.length === 0) {
                container.innerHTML = '<p class="empty-message">Your wishlist is currently empty. Explore categories and tap the heart icon to save items.</p>';
                return;
            }

            container.innerHTML = '';
            wishlist.forEach((item, index) => {
                container.innerHTML += `
                    <div class="wishlist-item">
                        <a href="${item.url}" class="wishlist-item-title">❤️ ${item.name}</a>
                        <button class="remove-btn" onclick="removeFromWishlist(${index})">✕ Remove</button>
                    </div>
                `;
            });
        }

        function removeFromWishlist(index) {
            let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
            wishlist.splice(index, 1);
            localStorage.setItem('wishlist', JSON.stringify(wishlist));
            loadWishlist();
        }

        window.onload = loadWishlist;
    </script>

</body>
</html>
