<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedrooms - The Priceless Touch</title>
    
    <!-- Custom Favicon -->
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="../images/favicon.ico">
    
    <style>
        :root {
            --bg-color: #3b0a12; --text-color: #ffffff; --nav-bg: #3b0a12;
            --border-color: rgba(255, 255, 255, 0.2); --accent-gold: #f3d06b;
            --header-action-color: #ffffff; --footer-color: rgba(255, 255, 255, 0.6);
            --pure-icon-color: #ffffff; --drawer-bg: #3b0a12; --drawer-text: #ffffff;
            --home-link-color: #ffffff; --curated-title-color: #ffffff;
        }
        body.light-mode {
            --bg-color: #fcfbfa; --text-color: #2c2c2c; --nav-bg: #f5f2f0;
            --border-color: rgba(0, 0, 0, 0.15); --accent-gold: #997413;
            --header-action-color: #000000; --footer-color: #2c2c2c;
            --pure-icon-color: #000000; --drawer-bg: #f5f2f0; --drawer-text: #2c2c2c;
            --home-link-color: #ffffff; --curated-title-color: #2d6a4f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; display: flex; flex-direction: column; min-height: 100vh; transition: background-color 0.3s ease, color 0.3s ease; }
        header { position: sticky; top: 0; z-index: 1000; background-color: var(--nav-bg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; transition: background-color 0.3s ease, border-color 0.3s ease; }
        .logo { font-size: 20px; font-weight: bold; color: var(--text-color); text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .logo img { height: 32px; width: auto; object-fit: contain; }
        .nav-icons { display: flex; gap: 15px; align-items: center; }
        .icon-btn { background: none; border: none; cursor: pointer; color: var(--header-action-color); font-size: 20px; display: flex; align-items: center; justify-content: center; padding: 5px; text-decoration: none; }
        .icon-btn img { width: 22px; height: 22px; object-fit: contain; filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.1)); }
        body:not(.light-mode) .icon-btn img { filter: invert(1) brightness(2); }
        .section-header { padding: 40px 20px 20px; background: var(--bg-color); }
        .section-header h1 { font-size: 28px; color: var(--accent-gold); margin-bottom: 10px; }
        .section-header p { font-size: 16px; color: var(--footer-color); max-width: 600px; margin: 0 auto; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; width: 100%; flex: 1; }
        .product-card { background: var(--nav-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 10px; transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-5px); }
        .product-img { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; background: #ddd; }
        .product-title { font-size: 16px; font-weight: bold; color: var(--text-color); text-align: left; }
        .product-price { font-size: 15px; color: var(--accent-gold); font-weight: bold; text-align: left; }
        .add-to-cart-btn { background: var(--accent-gold); color: #000; border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        .add-to-cart-btn:hover { opacity: 0.9; }
        footer { background-color: var(--nav-bg); border-top: 1px solid var(--border-color); padding: 20px; text-align: center; color: var(--footer-color); font-size: 14px; margin-top: auto; }
    </style>
</head>
<body>
    <header>
        <a href="../index.html" class="logo">
            <img src="../images/logo.png" alt="Logo"> The Priceless Touch
        </a>
        <div class="nav-icons">
            <a href="../wishlist.html" class="icon-btn" title="Wishlist">❤️</a>
            <a href="../cart.html" class="icon-btn" title="Cart">🛒</a>
        </div>
    </header>

    <div class="section-header">
        <h1>Bedrooms</h1>
        <p>Explore luxurious and cozy bedroom furniture and decor to create your ultimate sanctuary.</p>
    </div>

    <main class="products-grid">
        <!-- Products will be listed here -->
    </main>

    <footer>
        <p>&copy; 2026 The Priceless Touch. All rights reserved.</p>
    </footer>
</body>
</html>
