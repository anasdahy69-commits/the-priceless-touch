<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Priceless Touch | Curated Elegance</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #1a0f13;
            color: #f4e8e1;
            text-align: center;
        }
        .hero-container {
            position: relative;
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&w=1200&q=80') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #d4af37;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        p {
            font-size: 1.2rem;
            max-width: 600px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            background-color: #d4af37;
            color: #1a0f13;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }
        .btn:hover {
            background-color: #fff;
            transform: scale(1.05);
        }
        .disclosure {
            position: absolute;
            bottom: 15px;
            font-size: 0.8rem;
            color: #ccc;
            max-width: 800px;
            padding: 0 15px;
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <h1>The Priceless Touch</h1>
        <p>Discover hand-picked, elegant items designed to bring a touch of charm and sophistication to your everyday life.</p>
        
        <a href="categories.html" class="btn">Browse Categories</a>

        <div class="disclosure">
            Affiliate Disclosure: As an Amazon Associate, I earn from qualifying purchases at no extra cost to you.
        </div>
    </div>

</body>
</html>
