<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Priceless Touch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #3b0a12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            padding: 20px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        header h1 {
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 1.5px;
            font-family: serif;
        }
        .hero-container {
            width: 100%;
            background-color: #000;
        }
        .hero-image {
            width: 100%;
            max-height: 850px;
            object-fit: cover;
            display: block;
        }
        .content-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        .content-section h2 {
            font-size: 26px;
            font-weight: 300;
            letter-spacing: 2px;
            line-height: 1.4;
            margin-bottom: 35px;
            font-family: serif;
            text-transform: uppercase;
        }
        .btn-browse {
            display: inline-block;
            padding: 14px 45px;
            border: 1px solid #ffffff;
            border-radius: 35px;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            background: transparent;
        }
        .btn-browse:hover {
            background-color: #ffffff;
            color: #3b0a12;
        }
        <footer>
            padding: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <header>
        <h1>The Priceless Touch</h1>
    </header>

    <div class="hero-container">
        <img src="hero.jpg" alt="The Priceless Touch Hero" class="hero-image">
    </div>

    <div class="content-section">
        <h2>Discover Something<br>You'll Love</h2>
        <a href="categories.html" class="btn-browse">Browse Categories</a>
    </div>

    <footer>
        Affiliate Disclosure: As an Amazon Associate, I earn from qualifying purchases at no extra cost to you.
    </footer>

</body>
</html>
