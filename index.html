<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Priceless Touch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #3b0a12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            position: relative;
            background-color: #3b0a12;
            padding: 30px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .nav-links a.active {
            color: #d4af37;
            font-weight: 500;
        }
        .nav-links a:hover {
            color: #d4af37;
        }
        .hero-section {
            width: 100%;
            background-color: #000;
            margin-top: 0px;
        }
        .hero-section img {
            width: 100%;
            height: auto;
            max-height: 450px;
            object-fit: cover;
            display: block;
        }
        .content-container {
            flex: 1;
            padding: 10px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }
        .main-title {
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 2px;
            line-height: 1.4;
            font-family: serif;
            text-transform: uppercase;
            margin-top: 15px;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            padding: 14px 35px;
            border: 1px solid #ffffff;
            border-radius: 35px;
            color: #d4af37;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 1.5px;
            background: transparent;
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #d4af37;
        }
        footer {
            padding: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <header>
        <nav class="nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="categories.html">Categories</a>
            <a href="kitchen.html">Kitchen</a>
            <a href="decor.html">Decor</a>
        </nav>
    </header>

    <div class="hero-section">
        <img src="images/hero.JPG" alt="Hero Image" width="1200" height="600" fetchpriority="high">
    </div>

    <div class="content-container">
        <h2 class="main-title">Discover Something<br>You'll Love</h2>
        <a href="categories.html" class="btn">Browse Categories</a>
    </div>

    <footer>
        Affiliate Disclosure: As an Amazon Associate, I earn from qualifying purchases at no extra cost to you.
    </footer>

</body>
</html>
