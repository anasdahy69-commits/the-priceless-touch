<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Priceless Touch</title>
    
    <!-- Professional Favicon Integration -->
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="images/favicon.ico">

    <style>
        /* Colors and Variables: Default is Royal Burgundy, toggle switches to Clean White */
        :root {
            --bg-color: #3b0a12;
            --text-color: #ffffff;
            --nav-bg: #3b0a12;
            --border-color: rgba(255, 255, 255, 0.15);
            --accent-gold: #d4af37;
            --btn-hover-bg: rgba(255, 255, 255, 0.1);
            --footer-color: rgba(255, 255, 255, 0.55);
        }

        body.light-mode {
            --bg-color: #fcfbfa;
            --text-color: #2c2c2c;
            --nav-bg: #f5f2f0;
            --border-color: rgba(0, 0, 0, 0.1);
            --accent-gold: #b38f27;
            --btn-hover-bg: rgba(0, 0, 0, 0.05);
            --footer-color: #b38f27;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--nav-bg);
            /* تزويد المساحة فوق وتحت عشان الهيدر ينزل لتحت ويبقى مرتاح جداً على الموبايل */
            padding: 18px 12px;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .nav-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            /* مسافة فاصلة مريحة جداً ومتوازنة بين الكلمات وزرار الـ Light Mode */
            gap: 16px;
            max-width: 650px;
            margin: 0 auto;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            align-items: center;
            /* منع الالتفاف نهائياً لضمان بقاء جميع الكلمات في نفس السطر، مع مسافات متباعدة ومريحة */
            flex-wrap: nowrap;
            gap: 12px;
            font-size: 11.5px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            width: 100%;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 2px;
        }

        .nav-links::-webkit-scrollbar {
            display: none; /* إخفاء شريط التمرير لو الشاشة ضيقة جداً لضمان النظافة البصرية */
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .nav-links a.active {
            color: var(--accent-gold);
            font-weight: 500;
        }

        .nav-links a:hover {
            color: var(--accent-gold);
        }

        #theme-toggle {
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11.5px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        #theme-toggle:hover {
            background: var(--btn-hover-bg);
        }

        .hero-section {
            width: 100%;
            background-color: #000;
            margin-top: 0px;
        }

        .hero-section img {
            width: 100%;
            height: auto;
            max-height: 400px;
            object-fit: cover;
            display: block;
        }

        .content-container {
            flex: 1;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
        }

        .main-title {
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 2px;
            line-height: 1.4;
            font-family: serif;
            text-transform: uppercase;
            margin: 0;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            border: 1px solid var(--text-color);
            border-radius: 35px;
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1.5px;
            background: transparent;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .btn:hover {
            background: var(--btn-hover-bg);
            border-color: var(--accent-gold);
        }

        footer {
            padding: 18px 15px;
            font-size: 10px;
            line-height: 1.4;
            color: var(--footer-color);
            border-top: 1px solid var(--border-color);
            max-width: 650px;
            margin: 0 auto;
            transition: color 0.3s ease;
        }

        @media (min-width: 600px) {
            .nav-container {
                flex-direction: row;
                justify-content: space-between;
                padding: 0 15px;
                gap: 0;
            }
            .nav-links {
                font-size: 13px;
                gap: 25px;
                overflow-x: visible;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <nav class="nav-links">
                <a href="index.html" class="active">Home</a>
                <a href="categories.html">Categories</a>
                <a href="decor.html">Decor</a>
                <a href="kitchen.html">Kitchen</a>
            </nav>
            <button id="theme-toggle" aria-label="Toggle Theme">☀️ Light Mode</button>
        </div>
    </header>

    <div class="hero-section">
        <img src="images/hero.JPG" alt="Hero Image" width="1200" height="600" fetchpriority="high">
    </div>

    <div class="content-container">
        <h2 class="main-title">Discover Something<br>You'll Love</h2>
        <a href="categories.html" class="btn">Browse Categories</a>
    </div>

    <footer>
        Affiliate Disclosure: We are a participant in affiliate programs with Amazon, Target, Walmart, and other major retailers. We may earn a commission from qualifying purchases at no extra cost to you.
    </footer>

    <script>
        const themeToggleBtn = document.getElementById('theme-toggle');
        const bodyElement = document.body;

        if (localStorage.getItem('theme') === 'light') {
            bodyElement.classList.add('light-mode');
            themeToggleBtn.textContent = '🌙 Luxury Mode';
        } else {
            themeToggleBtn.textContent = '☀️ Light Mode';
        }

        themeToggleBtn.addEventListener('click', () => {
            bodyElement.classList.toggle('light-mode');
            
            if (bodyElement.classList.contains('light-mode')) {
                themeToggleBtn.textContent = '🌙 Luxury Mode';
                localStorage.setItem('theme', 'light');
            } else {
                themeToggleBtn.textContent = '☀️ Light Mode';
                localStorage.setItem('theme', 'dark');
            }
        });
    </script>

</body>
</html>
