<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Priceless Touch</title>
    
    <!-- Professional Favicon Integration -->
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="images/favicon.ico">

    <style>
        /* Colors and Variables: Default is Royal Burgundy, toggle switches to Clean White */
        :root {
            --bg-color: #3b0a12;
            --text-color: #ffffff;
            --nav-bg: #3b0a12;
            --border-color: rgba(255, 255, 255, 0.2);
            --accent-gold: #f3d06b;
            --btn-hover-bg: rgba(255, 255, 255, 0.12);
            --footer-color: rgba(255, 255, 255, 0.6);
        }

        body.light-mode {
            --bg-color: #fcfbfa;
            --text-color: #2c2c2c;
            --nav-bg: #f5f2f0;
            --border-color: rgba(0, 0, 0, 0.15);
            --accent-gold: #997413;
            --btn-hover-bg: rgba(0, 0, 0, 0.08);
            --footer-color: #6c5713;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--nav-bg);
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 650px;
            margin: 0 auto;
            width: 100%;
        }

        /* Theme Toggle Button */
        #theme-toggle {
            background: transparent;
            border: 1.5px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 6px 12px;
            width: 82px;
            text-align: center;
            border-radius: 20px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        #theme-toggle:hover {
            background: var(--btn-hover-bg);
        }

        /* كلمة About باللون الأصفر في الجهة المقابلة للزرار */
        .about-link {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--accent-gold);
            text-decoration: underline;
            text-underline-offset: 4px;
            text-decoration-thickness: 1.5px;
            text-decoration-color: var(--accent-gold);
            text-transform: uppercase;
            white-space: nowrap;
            opacity: 0.95;
            transition: opacity 0.3s ease;
        }

        .about-link:hover {
            opacity: 1;
        }

        .hero-section {
            width: 100%;
            background-color: #000;
        }

        .hero-section img {
            width: 100%;
            height: auto;
            max-height: 350px;
            object-fit: cover;
            display: block;
        }

        .content-container {
            padding: 35px 24px 50px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            min-height: 35vh;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        .main-title {
            font-size: 21px;
            font-weight: 400;
            letter-spacing: 1.8px;
            line-height: 1.4;
            font-family: serif;
            text-transform: uppercase;
            width: 100%;
            margin: 0;
        }

        .btn {
            display: inline-block;
            width: auto;
            min-width: 230px;
            padding: 14px 32px;
            border: 1.5px solid var(--text-color);
            border-radius: 35px;
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            background: transparent;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .btn:hover {
            background: var(--btn-hover-bg);
            border-color: var(--accent-gold);
        }

        footer {
            margin-top: auto;
            padding: 40px 20px 40px 20px;
            font-size: 11px;
            font-weight: 500;
            line-height: 1.6;
            color: var(--footer-color);
            border-top: 1px solid var(--border-color);
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
            width: 100%;
            transition: color 0.3s ease, border-color 0.3s ease;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <button id="theme-toggle" aria-label="Toggle Theme">☀️ Light</button>
            <a href="about.html" class="about-link">About</a>
        </div>
    </header>

    <div class="hero-section">
        <img src="images/hero.JPG" alt="Hero Name" width="1200" height="600" fetchpriority="high">
    </div>

    <div class="content-container">
        <h2 class="main-title">Discover Something<br>You'll Love</h2>
        <a href="categories.html" class="btn">Browse Categories</a>
    </div>

    <footer>
        <p>Affiliate Disclosure: We are a participant in affiliate programs with Amazon, Target, Walmart, and other major retailers. We may earn a commission from qualifying purchases at no extra cost to you, helping us bring you the finest selections.</p>
    </footer>

    <script>
        const themeToggleBtn = document.getElementById('theme-toggle');
        const bodyElement = document.body;

        // Apply saved theme across all pages automatically
        if (localStorage.getItem('theme') === 'light') {
            bodyElement.classList.add('light-mode');
            themeToggleBtn.textContent = '🌙 Dark';
        } else {
            themeToggleBtn.textContent = '☀️ Light';
        }

        themeToggleBtn.addEventListener('click', () => {
            bodyElement.classList.toggle('light-mode');
            
            if (bodyElement.classList.contains('light-mode')) {
                themeToggleBtn.textContent = '🌙 Dark';
                localStorage.setItem('theme', 'light');
            } else {
                themeToggleBtn.textContent = '☀️ Light';
                localStorage.setItem('theme', 'dark');
            }
        });
    </script>

</body>
</html>
