<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - The Priceless Touch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #3b0a12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            padding: 20px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        header h1 {
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 1.5px;
            font-family: serif;
        }
        .top-title {
            padding: 40px 20px 20px 20px;
        }
        .top-title h2 {
            font-size: 26px;
            font-weight: 300;
            letter-spacing: 2px;
            line-height: 1.4;
            font-family: serif;
            text-transform: uppercase;
        }
        .search-container {
            padding: 0 20px 30px 20px;
        }
        .search-box {
            display: inline-block;
            padding: 12px 25px;
            border: 1px solid #ffffff;
            border-radius: 35px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            letter-spacing: 1px;
            background: transparent;
            width: 100%;
            max-width: 320px;
        }
        .categories-container {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }
        .category-card {
            width: 100%;
            max-width: 400px;
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        .category-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }
        .category-title {
            padding: 20px;
            font-size: 20px;
            font-weight: 400;
            color: #3b0a12;
            font-family: serif;
            letter-spacing: 1px;
        }
        footer {
            padding: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <header>
        <h1>The Priceless Touch</h1>
    </header>

    <div class="top-title">
        <h2>Curated<br>Just For You.</h2>
    </div>

    <div class="search-container">
        <div class="search-box">🔍 Search for a category or board...</div>
    </div>

    <div class="categories-container">
        <div class="category-card">
            <img src="category1.jpg" alt="Home Essentials">
            <div class="category-title">Home Essentials</div>
        </div>

        <div class="category-card">
            <img src="category2.jpg" alt="Organizing">
            <div class="category-title">Organizing</div>
        </div>
    </div>

    <footer>
        Affiliate Disclosure: As an Amazon Associate, I earn from qualifying purchases at no extra cost to you.
    </footer>

</body>
</html>
