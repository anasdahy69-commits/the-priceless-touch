<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories | The Priceless Touch</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: 'Arial', sans-serif;
            background-color: #1a0f13;
            color: #f4e8e1;
            text-align: center;
        }
        h2 {
            font-size: 2.5rem;
            color: #d4af37;
            margin-bottom: 40px;
        }
        .categories-grid {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }
        .category-card {
            background-color: #2a161d;
            border-radius: 15px;
            overflow: hidden;
            width: 300px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            transition: 0.3s;
            border: 1px solid #d4af3755;
        }
        .category-card:hover {
            transform: translateY(-8px);
            border-color: #d4af37;
        }
        .category-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .category-title {
            padding: 20px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #d4af37;
        }
        .back-link {
            display: inline-block;
            margin-top: 40px;
            color: #f4e8e1;
            text-decoration: none;
            border-bottom: 1px solid #d4af37;
            padding-bottom: 3px;
        }
    </style>
</head>
<body>

    <h2>Explore Our Collections</h2>

    <div class="categories-grid">
        <!-- Home Decor Category -->
        <a href="decor.html" class="category-card">
            <img src="https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&w=600&q=80" alt="Home Decor" class="category-img">
            <div class="category-title">Luxury Home Decor</div>
        </a>

        <!-- Kitchen Tools Category -->
        <a href="kitchen.html" class="category-card">
            <img src="https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&w=600&q=80" alt="Kitchen Tools" class="category-img">
            <div class="category-title">Modern Kitchenware</div>
        </a>
    </div>

    <div>
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

</body>
</html>
