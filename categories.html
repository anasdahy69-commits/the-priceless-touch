<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - The Priceless Touch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #3b0a12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            padding: 20px 15px 15px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        header h1 {
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 1.5px;
            font-family: serif;
            margin-bottom: 12px;
        }
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .nav-links a.active {
            color: #d4af37; /* اللون الذهبي للصفحة الحالية */
            font-weight: 500;
        }
        .nav-links a:hover {
            color: #d4af37;
        }
        .top-title {
            padding: 40px 20px 30px 20px;
        }
        .top-title h2 {
            font-size: 26px;
            font-weight: 300;
            letter-spacing: 2px;
            line-height: 1.4;
            font-family: serif;
            text-transform: uppercase;
        }
        .categories-container {
            flex: 1;
            padding: 10px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 45px;
            align-items: center;
        }
        .category-item {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .category-card {
            display: block;
            width: 100%;
            background-color: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-decoration: none;
            transition: transform 0.3s ease;
        }
        .category-card:hover {
            transform: scale(1.02);
        }
        .category-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }
        .category-title {
            margin-top: 15px;
            font-size: 20px;
            font-weight: 300;
            color: #ffffff;
            font-family: serif;
            letter-spacing: 1.5px;
        }
        footer {
            padding: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <header>
        <h1>The Priceless Touch</h1>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="categories.html" class="active">Categories</a>
            <a href="kitchen.html">Kitchen</a>
            <a href="decor.html">Decor</a>
        </nav>
    </header>

    <div class="top-title">
        <h2>Curated<br>Just For You.</h2>
    </div>

    <div class="categories-container">
        <!-- القسم الأول (المطبخ) -->
        <div class="category-item">
            <a href="kitchen.html" class="category-card">
                <img src="Category1.PNG" alt="Kitchen">
            </a>
            <div class="category-title">Kitchen</div>
        </div>

        <!-- القسم الثاني (ديكور البيت) -->
        <div class="category-item">
            <a href="decor.html" class="category-card">
                <img src="Category2.PNG" alt="Home Decor">
            </a>
            <div class="category-title">Home Decor</div>
        </div>
    </div>

    <footer>
        Affiliate Disclosure: As an Amazon Associate, I earn from qualifying purchases at no extra cost to you.
    </footer>

</body>
</html>
