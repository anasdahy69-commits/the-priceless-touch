<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - The Priceless Touch</title>
    
    <!-- Custom Favicon -->
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #3b0a12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        /* Sticky header configuration */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: #3b0a12;
            padding: 22px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .nav-links a.active {
            color: #d4af37;
            font-weight: 500;
        }
        .nav-links a:hover {
            color: #d4af37;
        }
        .top-title {
            padding: 40px 20px 25px 20px;
        }
        .top-title h2 {
            font-size: 26px;
            font-weight: 300;
            letter-spacing: 2px;
            line-height: 1.4;
            font-family: serif;
            text-transform: uppercase;
        }
        .categories-container {
            flex: 1;
            padding: 10px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }
        .category-item {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .category-card {
            display: block;
            width: 100%;
            background-color: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-decoration: none;
            transition: transform 0.3s ease;
        }
        .category-card:hover {
            transform: scale(1.02);
        }
        .category-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }
        .category-title {
            margin-top: 15px;
            font-size: 20px;
            font-weight: 300;
            color: #ffffff;
            font-family: serif;
            letter-spacing: 1.5px;
        }
        footer {
            padding: 18px 15px;
            font-size: 10px;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.55);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 650px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <header>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="categories.html" class="active">Categories</a>
            <a href="decor.html">Decor</a>
            <a href="kitchen.html">Kitchen</a>
        </nav>
    </header>

    <div class="top-title">
        <h2>Curated<br>Just For You.</h2>
    </div>

    <div class="categories-container">
        <!-- Home Decor First -->
        <div class="category-item">
            <a href="decor.html" class="category-card">
                <img src="images/category2.webp" alt="Home Decor" width="400" height="280" loading="lazy">
            </a>
            <div class="category-title">Home Decor</div>
        </div>

        <!-- Kitchen Second -->
        <div class="category-item">
            <a href="kitchen.html" class="category-card">
                <img src="images/Category1.webp" alt="Kitchen" width="400" height="280" loading="lazy">
            </a>
            <div class="category-title">Kitchen</div>
        </div>
    </div>

    <footer>
        Affiliate Disclosure: We are a participant in affiliate programs with Amazon, Target, Walmart, and other major retailers. We may earn a commission from qualifying purchases at no extra cost to you.
    </footer>

</body>
</html>
