<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Decor - The Priceless Touch</title>
    
    <!-- أيقونة الموقع المخصصة -->
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #3b0a12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: #3b0a12;
            padding: 22px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .nav-links a.active {
            color: #d4af37;
            font-weight: 500;
        }
        .nav-links a:hover {
            color: #d4af37;
        }
        .hero-section {
            width: 100%;
            background-color: #000;
        }
        .hero-section img {
            width: 100%;
            height: auto;
            max-height: 450px;
            object-fit: cover;
            display: block;
        }
        .content-container {
            flex: 1;
            padding: 40px 20px 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .page-title {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 2px;
            font-family: serif;
            text-transform: uppercase;
            margin-bottom: 25px;
        }
        .search-box {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            margin-bottom: 35px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            text-align: center;
            transition: border-color 0.3s ease;
        }
        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
        }
        .search-box:focus {
            border-color: #d4af37;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 900px;
        }
        footer {
            padding: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <header>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="categories.html">Categories</a>
            <a href="kitchen.html">Kitchen</a>
            <a href="decor.html" class="active">Decor</a>
        </nav>
    </header>

    <div class="hero-section">
        <img src="images/category2.webp" alt="Home Decor" width="1200" height="600" loading="lazy">
    </div>

    <div class="content-container">
        <h2 class="page-title">Home Decor</h2>

        <input type="text" id="searchInput" class="search-box" placeholder="Search decor items..." onkeyup="searchProducts()">

        <div class="products-grid" id="productsContainer">
        </div>
    </div>

    <script>
        function searchProducts() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let items = document.querySelectorAll('.product-card');

            items.forEach(item => {
                let text = item.textContent.toLowerCase();
                if (text.includes(input)) {
                    item.style.display = "flex";
                } else {
                    item.style.display = "none";
                }
            });
        }
    </script>

    <footer>
        Affiliate Disclosure: As an Amazon Associate, I earn from qualifying purchases at no extra cost to you.
    </footer>

</body>
</html>
