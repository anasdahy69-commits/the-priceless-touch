<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Decor - The Priceless Touch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #3b0a12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            padding: 20px 15px 15px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        header h1 {
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 1.5px;
            font-family: serif;
            margin-bottom: 12px;
        }
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .nav-links a.active {
            color: #d4af37; /* اللون الذهبي للصفحة الحالية */
            font-weight: 500;
        }
        .nav-links a:hover {
            color: #d4af37;
        }
        .content-container {
            flex: 1;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .page-title {
            font-size: 26px;
            font-weight: 300;
            letter-spacing: 2px;
            font-family: serif;
            text-transform: uppercase;
            margin-bottom: 30px;
        }
        /* هنا هنبقى نضيف المنتجات بعدين براحتنا */
        .products-placeholder {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 1px;
        }
        footer {
            padding: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <header>
        <h1>The Priceless Touch</h1>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="categories.html">Categories</a>
            <a href="kitchen.html">Kitchen</a>
            <a href="decor.html" class="active">Decor</a>
        </nav>
    </header>

    <div class="content-container">
        <h2 class="page-title">Home Decor</h2>
        <div class="products-placeholder">Products coming soon...</div>
    </div>

    <footer>
        Affiliate Disclosure: As an Amazon Associate, I earn from qualifying purchases at no extra cost to you.
    </footer>

</body>
</html>
