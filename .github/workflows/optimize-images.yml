name: Optimize Images

on:
  push:
    paths:
      - 'images/**'
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Optimize images
        uses: hirasso/actions-image-optimizer@v1
        with:
          commit_message: 'Optimize images automatically'
